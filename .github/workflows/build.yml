name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the build to this existing release tag (e.g. v0.4.0). Leave empty to only build."
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test
        run: cargo test --workspace
      - name: Build server and console host
        run: cargo build --release -p velodesk-host -p velodesk-server
      - name: Build Veyndesk app + installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item desktop/src-tauri/target/release/Veyndesk.exe portable/
          Copy-Item target/release/velodesk-server.exe portable/
          Compress-Archive -Path portable/* -DestinationPath dist/Veyndesk-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: veyndesk-windows-x64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    needs: [windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: veyndesk-windows-x64, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
