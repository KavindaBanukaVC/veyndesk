name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the build to this existing release tag (e.g. v0.5.0). Leave empty to only build."
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test
        run: cargo test --workspace
      - name: Build server and console host
        run: cargo build --release -p veyndesk-host -p veyndesk-server
      - name: Build Veyndesk app + installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Collect files to sign
        shell: pwsh
        run: |
          New-Item -ItemType Directory unsigned | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe unsigned/
          Copy-Item desktop/src-tauri/target/release/Veyndesk.exe unsigned/

      # Code signing by SignPath Foundation (https://signpath.org). Runs only after the project is approved and
      # these are set in the repo settings: variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_SIGNING_POLICY_SLUG and secret SIGNPATH_API_TOKEN. Every request is approved manually in SignPath.
      - name: Upload files to sign
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: veyndesk-windows-unsigned
          path: unsigned/*
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Use signed files
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item signed/* unsigned/ -Force

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item unsigned/*-setup.exe dist/
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item unsigned/Veyndesk.exe portable/
          Copy-Item target/release/veyndesk-server.exe portable/
          Compress-Archive -Path portable/* -DestinationPath dist/Veyndesk-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: veyndesk-windows-x64
          path: dist/*

  linux:
    runs-on: ubuntu-24.04 # PipeWire headers new enough for screen capture (xcap)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev libclang-dev file
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test
        run: cargo test --workspace
      - name: Build Veyndesk .deb + AppImage
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Collect files
        run: |
          mkdir dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
      - uses: actions/upload-artifact@v4
        with:
          name: veyndesk-linux-x64
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test
        run: cargo test --workspace
      - name: Build Veyndesk .dmg (Apple Silicon + Intel)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
      - name: Collect files
        run: |
          mkdir dist
          cp desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: veyndesk-macos-universal
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
