name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the build to this existing release tag (e.g. v0.5.0). Leave empty to only build."
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test
        run: cargo test --workspace
      - name: Build server and console host
        run: cargo build --release -p velodesk-host -p velodesk-server
      - name: Build Veyndesk app + installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item desktop/src-tauri/target/release/Veyndesk.exe portable/
          Copy-Item target/release/velodesk-server.exe portable/
          Compress-Archive -Path portable/* -DestinationPath dist/Veyndesk-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: veyndesk-windows-x64
          path: dist/*

  linux:
    runs-on: ubuntu-22.04 # older glibc = runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev libclang-dev file
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test
        run: cargo test --workspace
      - name: Build Veyndesk .deb + AppImage
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Collect files
        run: |
          mkdir dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
      - uses: actions/upload-artifact@v4
        with:
          name: veyndesk-linux-x64
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test
        run: cargo test --workspace
      - name: Build Veyndesk .dmg (Apple Silicon + Intel)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
      - name: Collect files
        run: |
          mkdir dist
          cp desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: veyndesk-macos-universal
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
