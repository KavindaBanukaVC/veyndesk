[package]
name = "velodesk-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
enigo = "0.6.1"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
rand = "0.9"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "2"
velodesk-protocol = { version = "0.1.0", path = "../protocol" }
webrtc = "0.21.1"
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_HiDpi", "Win32_Foundation"] }

[[bin]]
name = "velodesk-host"
path = "src/main.rs"

[dev-dependencies]
axum = "0.8.9"
