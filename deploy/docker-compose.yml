# One-command self-hosting with automatic HTTPS:
#   1. Point a DNS name (e.g. desk.example.com) at this machine.
#   2. Set DOMAIN below (or in .env) and run:  docker compose up -d
#   3. Admin token:  docker compose exec velodesk cat /data/admin_token
services:
  velodesk:
    build: ..
    restart: unless-stopped
    environment:
      VELODESK_TRUST_PROXY: "1"
      # VELODESK_ADMIN_TOKEN: "change-me"
    volumes:
      - velodesk-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-desk.example.com}
    command: caddy reverse-proxy --from ${DOMAIN:-desk.example.com} --to velodesk:8080
    volumes:
      - caddy-data:/data

volumes:
  velodesk-data:
  caddy-data:
